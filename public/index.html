<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Підбирай фільми свайпами, дивись трейлери і веди свою кінобібліотеку." />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MovieCasting" />
    <link rel="manifest" href="/MovieCasting/manifest.json" />
    <link rel="apple-touch-icon" href="/MovieCasting/icons/apple-touch-icon.png" />
    <style id="expo-reset">
      html, body { height: 100%; background: #0A0A12; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      #root { display: flex; height: 100%; flex: 1; }
      /* свайпи карток не повинні прокручувати сторінку */
      [data-swipe-card] { touch-action: none; }
    </style>
  </head>
  <body>
    <noscript>Увімкніть JavaScript, щоб користуватися MovieCasting.</noscript>
    <div id="root"></div>
  </body>
</html>
